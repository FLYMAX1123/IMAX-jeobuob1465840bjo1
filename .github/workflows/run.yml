name: CGV 광교 IMAX 알리미

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 프로그램 설치
        run: pip install -r requirements.txt

      - name: IMAX 알리미 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python imax.py

      - name: IMAX 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f last_imax.json ]; then
            git add last_imax.json

            if git diff --cached --quiet; then
              echo "변경된 IMAX 기록이 없습니다."
            else
              git commit -m "Update IMAX schedules"
              git push
            fi
          else
            echo "last_imax.json 파일이 없습니다. 저장을 건너뜁니다."
          fi
